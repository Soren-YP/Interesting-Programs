<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D · 蓝色切片</title>
<style>
  :root {
    --void: #ffffff;
    --ink: #0a0a0d;
    --ink-2: #55565c;
    --mute: #9a9ba2;
    --shard: #e8e9ed;
    --hair: #e3e4e8;
    --blue: #1e3cff;
    --blue-2: #2b86ff;
    --cyan: #27d3f5;
    --cjk: "MiSans", "Noto Sans SC", "Microsoft YaHei UI", sans-serif;
    --cjk-heavy: "Noto Sans SC Black", "Noto Sans SC", "MiSans", sans-serif;
    --grot: "Bahnschrift", "Segoe UI Variable Display", sans-serif;
    --mono: "Cascadia Mono", "Consolas", monospace;
    --tilt: -13deg;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--void); color: var(--ink); font-family: var(--cjk); -webkit-font-smoothing: antialiased; overflow: hidden; }

  /* —— 海报区 —— */
  .poster { position: relative; height: 372px; overflow: hidden; }
  .band { position: absolute; left: -10%; width: 130%; transform: rotate(var(--tilt)); transform-origin: 0 50%; }
  .b-grey { top: 300px; height: 118px; background: var(--shard); clip-path: polygon(18% 0, 100% 0, 100% 100%, 26% 100%); }
  .b-blue { top: 294px; height: 9px; background: var(--blue); clip-path: polygon(22% 0, 100% 0, 100% 100%, 23% 100%); }
  .b-cyan { top: 420px; height: 3px; background: var(--cyan); clip-path: polygon(30% 0, 64% 0, 64% 100%, 31% 100%); }
  .b-blue2 { top: 262px; height: 26px; background: var(--blue-2); clip-path: polygon(52% 0, 74% 0, 72% 100%, 50% 100%); opacity: .9; }
  .chip { position: absolute; background: var(--blue-2); }
  .chip.c1 { right: 210px; top: 28px; width: 46px; height: 14px; transform: rotate(-28deg); clip-path: polygon(0 40%, 100% 0, 80% 100%); }
  .chip.c2 { right: 120px; top: 238px; width: 30px; height: 10px; background: var(--blue); transform: rotate(-8deg); clip-path: polygon(0 0, 100% 30%, 20% 100%); }
  .chip.c3 { left: 620px; top: 330px; width: 120px; height: 3px; background: var(--cyan); transform: rotate(-4deg); }
  .chip.c4 { right: 420px; top: 64px; width: 18px; height: 18px; background: var(--ink); clip-path: polygon(0 0, 100% 40%, 30% 100%); }

  .title {
    position: absolute; left: 430px; top: 196px; transform: rotate(var(--tilt)); transform-origin: 0 100%;
    display: flex; align-items: flex-end; gap: 22px; white-space: nowrap;
  }
  .title .en {
    font: 700 132px/0.78 var(--grot); font-stretch: condensed; letter-spacing: -.03em;
    transform: skewX(-12deg); color: var(--ink);
  }
  .title .zh {
    font: 900 64px/1 var(--cjk-heavy); color: var(--blue); margin-bottom: 6px; transform: skewX(-8deg);
  }
  .title .n { font: 600 22px var(--grot); color: var(--ink-2); margin-bottom: 14px; transform: skewX(-12deg); }

  .brand { position: absolute; left: 44px; top: 30px; font: 700 30px/1 var(--grot); font-stretch: condensed; transform: skewX(-12deg); letter-spacing: -.01em; }
  .brand::after { content: ""; display: block; width: 46px; height: 5px; background: var(--blue); margin-top: 6px; transform: skewX(-30deg); }

  .views { position: absolute; left: 44px; top: 110px; list-style: none; margin: 0; padding: 0; }
  .views li {
    font: 700 30px/1.15 var(--grot); font-stretch: condensed; transform: skewX(-12deg);
    color: #c7c8ce; display: flex; align-items: baseline; gap: 10px; cursor: pointer;
  }
  .views li small { font: 500 12px var(--cjk); transform: skewX(12deg); color: var(--mute); }
  .views li.on { color: var(--ink); }
  .views li.on::before { content: ""; width: 22px; height: 6px; background: var(--blue); align-self: center; margin-right: 2px; }

  .tools { position: absolute; right: 44px; top: 30px; display: flex; gap: 10px; }
  .tools span { font: 12px var(--mono); color: var(--ink-2); padding: 8px 12px; letter-spacing: .04em; }
  .tools .new {
    background: var(--ink); color: #fff; font: 600 14px var(--cjk); padding: 9px 20px 9px 18px;
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
  }

  .search {
    position: absolute; left: 44px; bottom: 26px; width: 560px; height: 56px;
    display: grid; grid-template-columns: 56px 1fr auto; align-items: center;
    background: #fff; border: 2px solid var(--ink);
  }
  .search .go {
    height: 100%; display: grid; place-items: center; background: var(--blue); color: #fff; font: 700 15px var(--grot);
    clip-path: polygon(0 0, 100% 0, 78% 100%, 0 100%); padding-right: 8px;
  }
  .search .q { font-size: 17px; color: var(--mute); padding-left: 10px; }
  .search kbd { font: 11px var(--mono); color: var(--ink-2); margin-right: 14px; }

  /* —— 列表区 —— */
  .bar {
    display: flex; align-items: baseline; gap: 26px; padding: 18px 44px 12px; border-top: 1px solid var(--hair);
  }
  .bar .f { font: 700 18px var(--grot); font-stretch: condensed; transform: skewX(-12deg); color: #b9bac1; cursor: pointer; }
  .bar .f b { font: 500 12px var(--grot); margin-left: 4px; color: var(--mute); }
  .bar .f.on { color: var(--ink); }
  .bar .f.on b { color: var(--blue); }
  .bar .grow { flex: 1; }
  .bar .m { font: 11px var(--mono); color: var(--ink-2); letter-spacing: .04em; }

  .list { display: grid; grid-template-columns: 1fr 1fr; column-gap: 56px; padding: 0 44px; }
  .row {
    position: relative; display: grid; grid-template-columns: 42px 30px 1fr auto; align-items: center;
    height: 70px; border-bottom: 1px solid var(--hair); cursor: pointer; isolation: isolate;
  }
  .row::before {
    content: ""; position: absolute; inset: 8px -14px; z-index: -1; transform: skewX(-14deg) scaleX(0); transform-origin: 0 50%;
    background: var(--shard); transition: transform .22s cubic-bezier(.2, .9, .1, 1);
  }
  .row:hover::before, .row.hover::before { transform: skewX(-14deg) scaleX(1); }
  .row .no { font: 700 22px var(--grot); font-stretch: condensed; transform: skewX(-12deg); color: #c9cad0; }
  .row img, .row .fb { width: 20px; height: 20px; display: block; }
  .row .fb { background: var(--ink); color: #fff; display: grid; place-items: center; font: 700 11px var(--grot); }
  .row .t { min-width: 0; }
  .row .t b { display: block; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t small { font: 11.5px var(--mono); color: var(--mute); }
  .row .tg { font-size: 12px; color: var(--ink-2); text-align: right; }
  .row .tg span + span::before { content: " / "; color: #c9cad0; }
  .row.sel::before { background: var(--blue); transform: skewX(-14deg) scaleX(1); }
  .row.sel, .row.sel .t small, .row.sel .tg, .row.sel .no { color: #fff; }
  .row.sel .tg span + span::before { color: #9fb0ff; }

  /* 打开时的切片转场 */
  .wipe { position: fixed; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
  .wipe i { position: absolute; left: -20%; width: 140%; transform: rotate(var(--tilt)) translateX(-110%); }
  .wipe i:nth-child(1) { top: 38%; height: 120px; background: var(--blue); }
  .wipe i:nth-child(2) { top: 52%; height: 40px; background: var(--cyan); }
  .wipe i:nth-child(3) { top: 30%; height: 14px; background: var(--ink); }
  .wipe.go i { animation: slash .42s cubic-bezier(.7, 0, .2, 1) forwards; }
  .wipe.go i:nth-child(2) { animation-delay: .04s; }
  .wipe.go i:nth-child(3) { animation-delay: .08s; }
  @keyframes slash { to { transform: rotate(var(--tilt)) translateX(110%); } }
  @media (prefers-reduced-motion: reduce) { .wipe { display: none; } .row::before { transition: none; } }

  .hint { position: fixed; right: 44px; bottom: 16px; font: 10.5px var(--mono); color: var(--mute); letter-spacing: .04em; }
</style>
</head>
<body>
  <section class="poster">
    <div class="band b-grey"></div>
    <div class="band b-blue"></div>
    <div class="band b-blue2"></div>
    <div class="band b-cyan"></div>
    <i class="chip c1"></i><i class="chip c2"></i><i class="chip c3"></i><i class="chip c4"></i>

    <div class="brand">STAR</div>
    <ul class="views">
      <li class="on">FAVORITES <small>常用</small></li>
      <li>ALL <small>全部</small></li>
      <li>ARCHIVE <small>归档</small></li>
    </ul>

    <div class="title"><span class="en">FAVORITES</span><span class="zh">常用</span><span class="n">12</span></div>

    <div class="tools"><span>◐</span><span>导入 / 导出</span><span>批量</span><span class="new">＋ 新建收藏</span></div>

    <div class="search"><span class="go">GO</span><span class="q">搜索收藏，或输入网址</span><kbd>CTRL K</kbd></div>
  </section>

  <div class="bar" id="bar"></div>
  <div class="list" id="list"></div>

  <div class="wipe" id="wipe"><i></i><i></i><i></i></div>
  <div class="hint">点击任一收藏预览"打开"转场</div>

<script src="data.js"></script>
<script>
  const { bookmarks, categories, countIn, pad } = window.MOCK;
  document.getElementById('bar').innerHTML =
    `<span class="f on">ALL<b>12</b></span>` +
    categories.map((c) => `<span class="f">${c.en}<b>${pad(countIn(c.id))}</b></span>`).join('') +
    `<span class="grow"></span><span class="m">SORT · MANUAL</span><span class="m">⟳ CHECK LINKS</span>`;
  const fb = (b) => `onerror="this.outerHTML='<span class=fb>${b.title[0].toUpperCase()}</span>'"`;
  const col = (items) => items.map((b) => `
    <div class="row${b.index === 11 ? ' sel' : ''}${b.index === 4 ? ' hover' : ''}">
      <span class="no">${pad(b.index)}</span>
      <img src="${b.favicon}" alt="" ${fb(b)}>
      <span class="t"><b>${b.title}</b><small>${b.host.replace(/^www\./, '')}</small></span>
      <span class="tg">${b.tags.map((t) => `<span>${t}</span>`).join('')}</span>
    </div>`).join('');
  const half = Math.ceil(bookmarks.length / 2);
  document.getElementById('list').innerHTML =
    `<div>${col(bookmarks.slice(0, half))}</div><div>${col(bookmarks.slice(half))}</div>`;
  const wipe = document.getElementById('wipe');
  document.getElementById('list').addEventListener('click', () => {
    wipe.classList.remove('go'); void wipe.offsetWidth; wipe.classList.add('go');
  });
</script>
</body>
</html>
